[project]
name = "coalminegov-backend"
version = "1.0.0"
description = "AI-based Smart Governance & Compliance Monitoring System for Coal Mines — backend services"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: needs a PostgreSQL database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "B008", "S105", "S106", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []
