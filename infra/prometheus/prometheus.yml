global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: coalminegov

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: temporal-worker
    static_configs:
      - targets: ["worker:9464"]

  - job_name: consumers
    static_configs:
      - targets: ["consumers:9465"]

  - job_name: temporal-server
    static_configs:
      - targets: ["temporal:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
