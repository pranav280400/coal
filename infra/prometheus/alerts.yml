groups:
  - name: coalminegov-platform
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Lumen API is down

      - alert: ApiHighErrorRate
        expr: sum(rate(cmg_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(cmg_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of API requests are failing

      - alert: ApiSlowP95
        expr: histogram_quantile(0.95, sum by (le) (rate(cmg_http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: API p95 latency above 1.5s

      - alert: OutboxBacklog
        expr: cmg_outbox_backlog > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Domain events are not being published to Kafka (outbox backlog)

      - alert: KafkaConsumerLag
        expr: sum by (consumergroup) (kafka_consumergroup_lag) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Kafka consumer group {{ $labels.consumergroup }} is lagging"

      - alert: DeadLetterEvents
        expr: increase(cmg_events_consumed_total{outcome="dead_letter"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: Events were routed to the dead-letter queue

      - alert: LLMGatewayErrors
        expr: sum(rate(cmg_llm_requests_total{outcome="error"}[10m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: AI gateway (LiteLLM/vLLM) calls are failing
